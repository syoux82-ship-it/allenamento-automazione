name: Aggiornamento giornaliero allenamento

on:
  schedule:
    # 05:00 UTC = 06:00 Europe/Rome in inverno (ora solare), 07:00 in estate (ora legale).
    # GitHub Actions usa sempre UTC: se vuoi un orario civile fisso in Italia, aggiorna
    # questa riga due volte l'anno (fine marzo e fine ottobre), oppure accetta lo scarto di un'ora.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # permette di lanciarlo a mano da GitHub per testare

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # serve per poter fare il commit del risultato nel repo
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo script di aggiornamento
        run: python script.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit del risultato aggiornato
        run: |
          git config user.name "automazione-allenamento"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Aggiornamento dati $(date -u +%F)"
          git push
